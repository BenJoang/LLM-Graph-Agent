[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-graph-agent"
version = "0.1.0"
description = "A business-oriented LangGraph agent runtime"
requires-python = ">=3.12"
dependencies = [
    "langchain-core==1.4.0",
    "langchain-openai==1.2.1",
    "langgraph==1.2.0",
    "openai==2.37.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-frontmatter==1.3.0",
    "typing-extensions==4.15.0",
    "Pillow==12.2.0",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.136.1",
    "uvicorn==0.47.0",
]
observability = [
    "arize-phoenix-otel==0.17.1",
    "openinference-instrumentation-langchain==0.1.73",
]
postgres = [
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
]
rag = [
    "psycopg[binary]==3.3.4",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
]
legacy-checkpoints = [
    "langgraph-checkpoint-sqlite==3.1.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "aiosqlite==0.22.1",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
llm-graph-agent-api = "llm_graph_agent.api.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
